<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quant System - Dashboard</title>
    <!-- 引入 ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        /* ================= 1. 全局变量与主题 ================= */
        :root, [data-theme="dark"] {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --border-default: #30363d;
            --color-profit: #3fb950;
            --color-loss: #f85149;
            --color-warn: #d29922;
            --color-halt: #da3633;
            --color-accent: #58a6ff;
        }

        [data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-secondary: #f6f8fa;
            --bg-tertiary: #eaeef2;
            --text-primary: #1f2328;
            --text-secondary: #656d76;
            --border-default: #d0d7de;
            --color-profit: #1a7f37;
            --color-loss: #cf222e;
            --color-warn: #9a6700;
            --color-halt: #cf222e;
            --color-accent: #0969da;
        }

        /* ================= 2. 全局 Reset 与布局 ================= */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ================= 3. 顶栏 ================= */
        .topbar {
            height: 50px;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-default);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 30px;
            flex-shrink: 0;
        }
        .topbar h1 { font-size: 18px; color: var(--color-accent); margin-right: auto; }
        .status-item { display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .status-item .label { color: var(--text-secondary); }
        .status-item .value { font-weight: bold; font-family: monospace; }
        .value.normal { color: var(--color-profit); }
        .value.warn { color: var(--color-warn); }
        .value.halt { color: var(--color-halt); }

        .conn-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background-color: var(--color-loss); transition: background 0.3s;
        }
        .conn-dot.connected { background-color: var(--color-profit); box-shadow: 0 0 8px var(--color-profit); }

        .theme-btn {
            background: var(--bg-tertiary); color: var(--text-primary);
            border: 1px solid var(--border-default); padding: 5px 10px;
            border-radius: 4px; cursor: pointer; font-size: 12px;
        }

        /* ================= 4. 主内容区 ================= */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 左侧图表区 */
        .chart-area {
            flex: 1;
            position: relative;
            min-width: 0;
            padding: 10px;
        }
        #chart-container { width: 100%; height: 100%; }

        /* 右侧面板区 */
        .sidebar {
            width: 320px;
            background-color: var(--bg-secondary);
            border-left: 1px solid var(--border-default);
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 15px;
            overflow-y: auto;
        }

        .panel {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-default);
            border-radius: 6px;
            padding: 15px;
        }
        .panel h3 {
            font-size: 12px; color: var(--text-secondary);
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px;
        }
        .row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
        .row .label { color: var(--text-secondary); }
        .row .val { font-family: monospace; font-weight: bold; }
        .empty-state { text-align: center; color: var(--text-secondary); font-size: 13px; padding: 20px 0; }
    </style>
</head>
<body>

    <!-- 顶栏 -->
    <div class="topbar">
        <h1 id="symbol-title">BTCUSDT · 3m</h1>
        
        <div class="status-item">
            <span class="label">状态:</span>
            <span class="value" id="st-state">IDLE</span>
        </div>
        
        <div class="status-item">
            <span class="label">风控:</span>
            <span class="value normal" id="st-risk">NORMAL</span>
        </div>
        
        <div class="status-item">
            <span class="label">WS:</span>
            <div class="conn-dot" id="conn-dot"></div>
        </div>

        <button class="theme-btn" onclick="toggleTheme()">切换主题</button>
    </div>

    <!-- 主体区 -->
    <div class="main-content">
        <!-- 左侧 K 线 -->
        <div class="chart-area">
            <div id="chart-container"></div>
        </div>

        <!-- 右侧数据面板 -->
        <div class="sidebar">
            <!-- 活跃持仓 -->
            <div class="panel">
                <h3>Active Position</h3>
                <div id="pos-empty" class="empty-state">当前无持仓</div>
                <div id="pos-detail" style="display: none;">
                    <div class="row"><span class="label">方向</span><span class="val" id="p-dir">--</span></div>
                    <div class="row"><span class="label">入场价</span><span class="val" id="p-entry">--</span></div>
                    <div class="row"><span class="label">止损价</span><span class="val" id="p-stop">--</span></div>
                    <div class="row"><span class="label">持仓量</span><span class="val" id="p-qty">--</span></div>
                    <div class="row"><span class="label">峰值浮盈</span><span class="val" id="p-peak">--</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================= 1. 主题切换 =================
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            // 通知图表重绘
            if (window.myChart) {
                window.myChart.setOption(getChartOption([], []), true);
            }
        }

        // ================= 2. 图表初始化 =================
        const chartDom = document.getElementById('chart-container');
        window.myChart = echarts.init(chartDom, 'dark');

        let klineData = [];
        let volumeData = [];
        let xAxisData = [];
        const MAX_BARS = 500; // 前端内存保护，最多保留 500 根

        function getChartOption(kline, volume) {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            return {
                backgroundColor: 'transparent',
                tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
                grid: [
                    { left: '5%', right: '3%', top: '5%', height: '65%' },
                    { left: '5%', right: '3%', top: '75%', height: '15%' }
                ],
                xAxis: [
                    { type: 'category', data: xAxisData, scale: true, boundaryGap: false, axisLine: { onZero: false }, splitLine: { show: false }, axisLabel: { show: false } },
                    { type: 'category', gridIndex: 1, data: xAxisData, boundaryGap: false, axisLine: { onZero: false }, axisTick: { show: false }, splitLine: { show: false }, axisLabel: { show: false } }
                ],
                yAxis: [
                    { scale: true, splitArea: { show: true }, splitLine: { lineStyle: { color: isDark ? '#30363d' : '#eaeef2' } } },
                    { scale: true, gridIndex: 1, splitNumber: 2, axisLabel: { show: false }, axisLine: { show: false }, axisTick: { show: false }, splitLine: { show: false } }
                ],
                dataZoom: [{ type: 'inside', xAxisIndex: [0, 1], start: 50, end: 100 }],
                series: [
                    {
                        name: 'KLine', type: 'candlestick', data: kline,
                        itemStyle: {
                            color: isDark ? '#3fb950' : '#1a7f37',
                            color0: isDark ? '#f85149' : '#cf222e',
                            borderColor: isDark ? '#3fb950' : '#1a7f37',
                            borderColor0: isDark ? '#f85149' : '#cf222e'
                        }
                    },
                    {
                        name: 'Volume', type: 'bar', xAxisIndex: 1, yAxisIndex: 1, data: volume,
                        itemStyle: { color: isDark ? '#58a6ff' : '#0969da' }
                    }
                ]
            };
        }

        window.myChart.setOption(getChartOption([], []));
        window.addEventListener('resize', () => window.myChart.resize());

        // ================= 3. WebSocket 通信与防断线 =================
        let ws;
        let reconnectTimer = null;

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            const host = window.location.host || 'localhost:8000';
            
            ws = new WebSocket(`${protocol}${host}/ws/live`);

            ws.onopen = () => {
                document.getElementById('conn-dot').classList.add('connected');
                if (reconnectTimer) clearTimeout(reconnectTimer);
                console.log('WebSocket 已连接');
            };

            ws.onclose = () => {
                document.getElementById('conn-dot').classList.remove('connected');
                console.log('WebSocket 断开，3秒后重连...');
                reconnectTimer = setTimeout(connectWebSocket, 3000);
            };

            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    handleWebSocketMessage(msg);
                } catch (e) {
                    console.error('解析消息失败:', e);
                }
            };
        }

        // ================= 4. 消息处理核心 =================
        function handleWebSocketMessage(msg) {
            if (msg.type === 'history') {
                // 初始化历史 K 线
                klineData = []; volumeData = []; xAxisData = [];
                msg.data.forEach(bar => appendBarData(bar));
                renderChart();
            } 
            else if (msg.type === 'kline') {
                // 实时 K 线更新
                appendBarData(msg.data);
                renderChart();
            }
            else if (msg.type === 'system_status') {
                // 更新右侧与顶部面板
                updateSystemStatus(msg.data);
            }
        }

        function appendBarData(bar) {
            // 格式化时间为 HH:MM
            const d = new Date(bar.ts);
            const timeStr = ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
            
            // 注意：后端传来的可能是字符串（为了精度），这里转 float 给 ECharts
            const open = parseFloat(bar.open);
            const close = parseFloat(bar.close);
            const high = parseFloat(bar.high);
            const low = parseFloat(bar.low);
            const vol = parseFloat(bar.volume);

            const candle = [open, close, low, high];
            const volume = { value: vol, itemStyle: { color: close >= open ? (document.documentElement.getAttribute('data-theme') === 'dark' ? '#3fb950' : '#1a7f37') : (document.documentElement.getAttribute('data-theme') === 'dark' ? '#f85149' : '#cf222e') } };

            // 如果当前是同一根 K 线在跳动
            if (xAxisData.length > 0 && xAxisData[xAxisData.length - 1] === timeStr) {
                klineData[klineData.length - 1] = candle;
                volumeData[volumeData.length - 1] = volume;
            } else {
                // 新 K 线入队，并限制内存
                xAxisData.push(timeStr);
                klineData.push(candle);
                volumeData.push(volume);
                
                if (xAxisData.length > MAX_BARS) {
                    xAxisData.shift();
                    klineData.shift();
                    volumeData.shift();
                }
            }
        }

        function renderChart() {
            window.myChart.setOption({
                xAxis: [{ data: xAxisData }, { data: xAxisData }],
                series: [{ data: klineData }, { data: volumeData }]
            });
        }

        function updateSystemStatus(data) {
            // 1. 状态机
            const stEl = document.getElementById('st-state');
            stEl.innerText = (data.state || 'IDLE').toUpperCase();

            // 2. 风控
            const riskEl = document.getElementById('st-risk');
            const riskLevel = (data.risk || 'NORMAL').toUpperCase();
            riskEl.innerText = riskLevel;
            riskEl.className = 'value';
            if (riskLevel === 'NORMAL') riskEl.classList.add('normal');
            else if (riskLevel === 'HALT' || riskLevel === 'CLOSE_ONLY') riskEl.classList.add('halt');
            else riskEl.classList.add('warn');

            // 3. 活跃持仓
            const activeRound = data.active_round;
            const posEmpty = document.getElementById('pos-empty');
            const posDetail = document.getElementById('pos-detail');

            if (activeRound) {
                posEmpty.style.display = 'none';
                posDetail.style.display = 'block';

                const isLong = activeRound.direction === 1;
                const dirEl = document.getElementById('p-dir');
                dirEl.innerText = isLong ? '做多 (LONG)' : '做空 (SHORT)';
                dirEl.style.color = isLong ? 'var(--color-profit)' : 'var(--color-loss)';
                
                document.getElementById('p-entry').innerText = activeRound.entry_price;
                document.getElementById('p-stop').innerText = activeRound.current_stop;
                document.getElementById('p-qty').innerText = activeRound.total_qty;
                document.getElementById('p-peak').innerText = activeRound.peak_unrealized || '0';
            } else {
                posEmpty.style.display = 'block';
                posDetail.style.display = 'none';
            }
        }

        // ================= 5. 启动 =================
        connectWebSocket();

    </script>
</body>
</html>
