# ============================================================================
# config/base.yaml — 量化系统全局基础配置
# ============================================================================
#
# 加载顺序：base.yaml → step{N}.yaml → symbols/{symbol}.yaml
# 后者覆盖前者。环境变量可用 ${VAR:-default} 语法引用。
#
# 本文件被所有模式（backtest/shadow/live）、所有步骤、所有交易对共享。
# 本文件不放策略参数、不放因子权重、不放风控具体值——
# 那些在 step{N}.yaml 里，本文件只放它们的安全边界。
#
# 作者：张三
# 审查：比蒙（策略）、乐高（执行）
# 版本：v1.0.0
# ============================================================================

version: "1.0.0"
schema: 1  # 配置结构版本，加载时校验，结构变更时递增


# ============================================================================
# 系统标识与根路径
# ============================================================================
system:
  # 根目录。所有相对路径相对于此目录解析。
  root: "${QUANT_ROOT:-/opt/quant}"
  # 强制 UTC。不接受其他值，加载时校验。
  timezone: "UTC"
  # 模式由命令行 --mode 注入，此处不定义。
  # 当前 step 由命令行或 step{N}.yaml 注入，此处不定义。


# ============================================================================
# 路径配置
# ============================================================================
paths:
  log_dir: "${QUANT_LOG_DIR:-/opt/quant/logs}"
  data_dir: "${QUANT_DATA_DIR:-/opt/quant/data}"
  report_dir: "${QUANT_REPORT_DIR:-/opt/quant/reports}"
  config_dir: "${QUANT_CONFIG_DIR:-/opt/quant/config}"
  pid_dir: "${QUANT_PID_DIR:-/opt/quant/run}"
  backup_dir: "${QUANT_BACKUP_DIR:-/opt/quant/data/backup}"
  # 进程心跳文件，外部监控读此文件判断系统是否存活
  heartbeat_file: "/tmp/quant_heartbeat"
  # Kill switch 文件。touch 此文件 = 触发紧急停止
  kill_switch_file: "/tmp/quant_kill"

  # 相对路径解析规则：不以 / 开头的路径，相对于 system.root 解析
  # 示例：log_dir: "logs" → /opt/quant/logs


# ============================================================================
# 数据库
# ============================================================================
database:
  # SQLite WAL 模式，崩溃时不损坏数据
  wal_mode: true
  # FULL = 每次事务 fsync，最安全但最慢
  # NORMAL = 每秒 fsync，性能好但崩溃可能丢 1 秒数据
  # 实盘必须 FULL
  synchronous: "FULL"
  # 锁等待超时。多线程访问时，等待锁释放的最长时间
  busy_timeout_ms: 5000

  # 数据库文件路径按模式区分，由运行时拼接：
  #   live:     ${paths.data_dir}/live_quant.db
  #   shadow:   ${paths.data_dir}/shadow_quant.db
  #   backtest: ${paths.data_dir}/backtest_quant.db
  # 禁止共用同一个 db 文件。


# ============================================================================
# 日志
# ============================================================================
logging:
  # DEBUG / INFO / WARN / ERROR / CRITICAL
  level: "${LOG_LEVEL:-INFO}"
  # 时间戳格式：ISO 8601 UTC，带毫秒和 Z 后缀
  format: "[%(asctime)s] [%(levelname)s] [%(name)s] %(message)s"
  date_format: "%Y-%m-%dT%H:%M:%S.%fZ"
  # 强制 UTC，日志时间戳不跟随本地时区
  utc: true

  # 日志滚动
  rotate:
    enabled: true
    when: "hourly"        # 按小时滚动（影子/实盘日志量大）
    keep_hours: 720       # 保留 30 天（24 * 30）
    compress: true        # 滚动后 gzip 压缩

  # 异步写入
  async:
    enabled: true
    queue_size: 10000     # 队列满时丢弃 DEBUG，保留 INFO 及以上

  # 磁盘保护
  disk:
    min_free_gb: 10       # 磁盘低于此值报警
    critical_free_gb: 5   # 磁盘低于此值停止写入并报警
    cleanup_old_days: 30  # 磁盘紧急时清理 30 天前的日志


# ============================================================================
# 币安 API 端点
# ============================================================================
api:
  rest_base_url: "${BINANCE_REST_BASE_URL:-https://fapi.binance.com}"
  ws_base_url: "${BINANCE_WS_BASE_URL:-wss://fstream.binance.com}"

  # recvWindow：请求时间戳与交易所时间的容忍度。默认 5000ms，最大 60000ms
  recv_window_ms: 5000

  # 单次请求超时
  timeout_ms: 2000

  # 重试策略
  max_retries: 3
  retry_backoff_ms: [500, 1000, 2000]  # 指数退避

  # 密钥从环境变量读取，绝不放在配置文件里
  # api_key:    "${BINANCE_API_KEY}"     ← 由 .env 提供
  # api_secret: "${BINANCE_API_SECRET}"  ← 由 .env 提供


# ============================================================================
# 后端 API 服务（前端调用）
# ============================================================================
server:
  host: "0.0.0.0"
  port: 8000
  # 默认关闭。影子模式和回测不需要 API 服务。
  # 实盘和需要前端交互时开启。
  enabled: false
  # 紧急停止接口的 token 校验。
  # 环境变量 EMERGENCY_TOKEN 为空时，紧急停止接口禁用。
  emergency_token: "${EMERGENCY_TOKEN:-}"


# ============================================================================
# 时钟
# ============================================================================
clock:
  # 交易逻辑一律用单调时钟（clock.now_ms()），不受 NTP 回拨影响
  # 墙钟只用于日志和展示

  # 偏移超过此值报警
  ntp_warn_offset_ms: 200
  # 偏移超过此值拒绝启动
  ntp_reject_offset_ms: 5000
  # 定期重新校准（秒）
  resync_interval_s: 21600  # 6 小时
  # 偏移历史保留条数
  max_offset_history: 100


# ============================================================================
# 心跳
# ============================================================================
heartbeat:
  # 心跳写入间隔（秒）
  interval_s: 30
  # 超过此值未更新，判定为假死
  stale_threshold_s: 120


# ============================================================================
# 限频
# ============================================================================
rate_limit:
  # 币安永续合约限频
  # 订单限频：10 秒内最多 50 单。留 5 余量。
  orders_per_10s: 45
  # 权重限频：每分钟最多 1200 权重。留 200 余量。
  weight_per_min: 1000
  # 令牌桶回填速率：每秒回填 4.5 个令牌（45 / 10）
  bucket_refill_rate: 4.5

  # 权重请求优先级（数值越小越优先）
  priority:
    cancel: 0          # 撤单最高优先
    close_position: 1  # 平仓
    open_order: 2      # 开仓
    query: 3           # 查询
    reconcile: 4       # 对账最低优先

  # 触发限频（-1003）时的退避策略
  on_limit_exceeded:
    backoff_ms: 1000   # 初始退避
    max_backoff_ms: 30000  # 最大退避
    reset_window_s: 60     # 60 秒后重置退避


# ============================================================================
# 订单默认值
# ============================================================================
order:
  # Step 1 只用市价单。Step 2 引入限价单。
  default_type: "MARKET"

  # 市价单最大滑点（基点）。超过则改为限价单挂在第 5 档。
  max_slippage_bps: 50

  # 信号价与市价偏离上限。超过则拒单。
  max_price_deviation: 0.005  # 0.5%

  # 下单超时（毫秒）。超时后查 clientOrderId 确认状态。
  timeout_ms: 2000

  # 撤单超时（毫秒）
  cancel_timeout_ms: 1000

  # 服务器端止损单用标记价格触发（不用最新成交价）
  stop_working_type: "MARK_PRICE"

  # 止损单类型
  stop_order_type: "STOP_MARKET"


# ============================================================================
# 数据流
# ============================================================================
data:
  # 主 K 线周期
  kline_interval: "3m"

  # K 线环形缓冲区大小（根）
  kline_max_bars: 1000

  # 盘口快照过期阈值（毫秒）。超过则标记 stale。
  snapshot_max_age_ms: 3000

  # 盘口深度档位
  depth_levels: 20

  # WebSocket 重连策略
  ws_reconnect_delay_s: 1       # 初始延迟
  ws_reconnect_max_delay_s: 30  # 最大延迟（指数退避上限）
  # 主动 ping 间隔。币安 3 分钟不活跃会断开，必须主动保活。
  ws_ping_interval_s: 20


# ============================================================================
# 因子基础设施
# ============================================================================
factors:
  # 因子预热根数。前 N 根 K 线的因子值不可信（分位数窗口未填满）。
  # 状态机在预热期内不决策。
  warmup_bars: 500

  # 分位数归一化窗口（根 K 线）
  quantile_window: 500

  # 因子输出保留小数位
  output_precision: 6

  # 异常值判定：原始值超出历史 N 倍标准差，标记 outlier
  outlier_sigma: 5.0

  # 单因子计算耗时上限（毫秒）。超过报警。
  max_compute_ms: 5

  # 因子权重和具体参数在 step{N}.yaml 中，此处只放基础设施。


# ============================================================================
# 风控安全边界（硬上限）
# ============================================================================
# 任何配置文件中超过以下值时，启动失败，退出码 2。
# 这些是"无论如何不能突破"的底线，step{N}.yaml 不能修改。
# ============================================================================
safety_limits:
  # 单笔最大亏损占权益比例
  per_trade_risk_max: 0.02        # 2%
  # 日回撤降频线
  daily_dd_limit_max: 0.05        # 5%
  # 日回撤熔断线
  daily_dd_halt_max: 0.08         # 8%
  # 最大仓位占权益比例
  max_position_ratio_max: 0.5     # 50%
  # 最大杠杆
  leverage_max: 5                 # 5 倍
  # 市价单最大滑点
  max_slippage_bps_max: 100       # 100 bps = 1%
  # 价格偏离保护
  max_price_deviation_max: 0.01   # 1%
  # 订单超时上限
  order_timeout_ms_max: 5000      # 5 秒


# ============================================================================
# 守护与恢复
# ============================================================================
guard:
  # 连续异常次数阈值。超过则触发紧急停止。
  max_consecutive_errors: 5

  # 启动时检查 PID 锁（防止多实例）
  pid_check: true

  # 启动时检查磁盘空间
  disk_check: true

  # 实盘启动前强制 preflight（20+ 项检查）
  preflight_enabled: true

  # 紧急停止倒计时（秒）。期间可取消。
  emergency_cooldown_s: 10

  # 重启后的对账策略：
  #   "strict"：本地和交易所不一致时拒绝启动，需人工确认
  #   "lenient"：不一致时自动修正（仅回测模式）
  reconcile_on_restart: "strict"


# ============================================================================
# 占位说明
# ============================================================================
# 以下内容由运行时注入，不在此文件定义：
#   mode          ← 命令行 --mode
#   symbol        ← 命令行 --symbol
#   current_step  ← step{N}.yaml 或命令行
#   seed          ← 命令行 --seed（回测）
#   initial_equity ← 命令行 --initial_equity
#   api_key       ← 环境变量 BINANCE_API_KEY
#   api_secret    ← 环境变量 BINANCE_API_SECRET
#   emergency_token ← 环境变量 EMERGENCY_TOKEN
#
# 以下内容在 step{N}.yaml 中定义：
#   因子权重、因子参数、策略参数、风控具体值、执行具体值、轮次参数
#
# 以下内容在 symbols/{symbol}.yaml 中定义：
#   面值、tickSize、stepSize、minNotional、默认杠杆、手续费率
